name: receipt_ai_scanner
description: AI-powered receipt and invoice scanner with automatic data extraction
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # File & Gallery Access
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Permissions
  permission_handler: ^11.1.0
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Utilities
  http: ^1.2.0
  intl: ^0.19.0
  uuid: ^4.3.3
  package_info_plus: ^9.0.0
  url_launcher: ^6.2.5
  
  # Monetization
  purchases_flutter: ^6.29.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

