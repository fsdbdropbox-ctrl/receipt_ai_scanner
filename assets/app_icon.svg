<svg width="256" height="256" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" id="master-icon">



                <!-- Definiciones de filtros y gradientes -->

                <defs>

                    <linearGradient id="blueGradient" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">

                        <stop offset="0%" stop-color="#3B82F6"></stop> <!-- Azul un poco más claro arriba -->

                        <stop offset="100%" stop-color="#2563EB"></stop> <!-- Tu azul corporativo abajo -->

                    </linearGradient>

                    

                    <linearGradient id="scanBeam" x1="0" y1="0" x2="100%" y2="0">

                        <stop offset="0%" stop-color="rgba(34, 211, 238, 0)"></stop>

                        <stop offset="20%" stop-color="rgba(34, 211, 238, 0.4)"></stop>

                        <stop offset="50%" stop-color="rgba(255, 255, 255, 0.9)"></stop>

                        <stop offset="80%" stop-color="rgba(34, 211, 238, 0.4)"></stop>

                        <stop offset="100%" stop-color="rgba(34, 211, 238, 0)"></stop>

                    </linearGradient>

                    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">

                        <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#1e3a8a" flood-opacity="0.4"></feDropShadow>

                    </filter>

                    

                    <filter id="glow-beam" x="-50%" y="-50%" width="200%" height="200%">

                         <feGaussianBlur stdDeviation="15" result="coloredBlur"></feGaussianBlur>

                         <feMerge>

                             <feMergeNode in="coloredBlur"></feMergeNode>

                             <feMergeNode in="SourceGraphic"></feMergeNode>

                         </feMerge>

                    </filter>

                </defs>

                <!-- 1. Fondo (Squircle) -->

                <rect x="0" y="0" width="1024" height="1024" rx="240" fill="url(#blueGradient)"></rect>

                <!-- 2. Recibo (Sombra y Forma) -->

                <!-- Sombra suave detrás del papel -->

                <path d="M280 180 H744 V800 L686 760 L628 800 L570 760 L512 800 L454 760 L396 800 L338 760 L280 800 V180 Z" fill="black" fill-opacity="0.2" transform="translate(0, 15)" filter="blur(10px)"></path>

                <!-- Papel Principal -->

                <path d="M280 180 H744 V800 L686 760 L628 800 L570 760 L512 800 L454 760 L396 800 L338 760 L280 800 V180 Z" fill="white"></path>

                

                <!-- Detalles del recibo (Líneas sutiles de texto) -->

                <rect x="340" y="260" width="344" height="24" rx="12" fill="#E5E7EB"></rect>

                <rect x="340" y="320" width="200" height="20" rx="10" fill="#F3F4F6"></rect>

                <rect x="640" y="320" width="44" height="20" rx="10" fill="#F3F4F6"></rect>

                

                <rect x="340" y="380" width="160" height="20" rx="10" fill="#F3F4F6"></rect>

                <rect x="640" y="380" width="44" height="20" rx="10" fill="#F3F4F6"></rect>

                <!-- Sección inferior (Simulando datos procesados/IA) -->

                <rect x="340" y="600" width="120" height="20" rx="10" fill="#DBEAFE"></rect> <!-- Azul muy claro -->

                <rect x="584" y="580" width="100" height="60" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="4"></rect>

                <!-- 3. Elemento de Escaneo (IA) -->

                <g class="scan-line-anim" style="transform-origin: center;">

                    <!-- Línea de escaneo principal -->

                    <rect x="200" y="480" width="624" height="12" rx="6" fill="url(#scanBeam)" filter="url(#glow-beam)"></rect>

                    

                    <!-- Marcadores laterales (Lente) -->

                    <path d="M230 430 V460 H260" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>

                    <path d="M230 530 V500 H260" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>

                    <path d="M794 430 V460 H764" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>

                    <path d="M794 530 V500 H764" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>

                </g>

                <!-- Brillo sutil superior (Glassmorphism) -->

                <path d="M0 0 H1024 V512 C1024 512 800 300 512 300 C224 300 0 512 0 512 V0Z" fill="white" fill-opacity="0.05" style="mix-blend-mode: overlay;"></path>

            </svg>
